<!DOCTYPE html>
<html>
  <head>
    <title>Test Kiss Count API</title>
  </head>
  <body>
    <h1>Test Kiss Count API</h1>
    <button onclick="testKissCount()">Test Kiss Count</button>
    <button onclick="testMessageCount()">Test Message Count</button>
    <div id="result"></div>

    <script>
      async function testKissCount() {
        try {
          console.log("Testing kiss count API...");
          const response = await fetch("/api/kisses/count");
          const data = await response.json();
          console.log("Kiss count result:", data);
          document.getElementById("result").innerHTML = `<h2>Kiss Count: ${
            data.count
          }</h2><pre>${JSON.stringify(data, null, 2)}</pre>`;
        } catch (error) {
          console.error("Error:", error);
          document.getElementById(
            "result"
          ).innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
      }

      async function testMessageCount() {
        try {
          console.log("Testing message count API...");
          const response = await fetch("/api/messages/count");
          const data = await response.json();
          console.log("Message count result:", data);
          document.getElementById("result").innerHTML = `<h2>Message Count: ${
            data.count
          }</h2><pre>${JSON.stringify(data, null, 2)}</pre>`;
        } catch (error) {
          console.error("Error:", error);
          document.getElementById(
            "result"
          ).innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
      }
    </script>
  </body>
</html>
